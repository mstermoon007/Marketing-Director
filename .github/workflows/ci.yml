name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches Dockerfile (python:3.11-slim)
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pytest>=8.0" "pytest-asyncio>=0.23" "pytest-cov>=5.0" "ruff>=0.4.0"

      - name: Ruff lint (informational — not yet enforced)
        # The codebase currently has ~2900 existing ruff findings, so this step
        # is non-blocking: CI stays green while the lint backlog is cleared.
        continue-on-error: true
        run: ruff check .

      - name: Pytest
        run: pytest

  frontend:
    name: Frontend (TypeScript build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        # Note: package-lock.json is gitignored, so this is a fresh resolution
        # that installs devDependencies (typescript) needed for the build.
        run: npm install

      - name: Build (tsc compile)
        run: npm run build
