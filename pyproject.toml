# =========================================================================
# 项目级配置（GitHub 开源标准）
# Python: 3.9+  |  Linter: Ruff (替代 flake8+isort)  |  Formatter: Black
# =========================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marketing-strategy-agent"
version = "1.0.0"
description = "AI企业营销战略执行智能体 — FastAPI 后端 + 微信小程序前端"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AI Marketing Team" }
]
keywords = [
    "marketing",
    "agent",
    "fastapi",
    "wechat-miniprogram",
    "ai",
    "gpt",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# -------------------------------------------------------------------------
# 运行时依赖 —— 与 src/ 下 import 语句严格一一对应（AST 全量扫描校验）
# 校验方式：python scripts/check_dependency_drift.py
# 每一项后注明「导入名 ← 引用位置」，隐式依赖单独标注理由，禁止无主依赖。
# -------------------------------------------------------------------------
dependencies = [
    # Web 框架与服务
    "fastapi>=0.110",              # fastapi        ← src/api/*.py（14 处）
    "uvicorn[standard]>=0.27",     # uvicorn        ← src/api/main.py:116（__main__ 启动入口）
    "pydantic>=2.0",               # pydantic       ← src/api/*.py、src/models/*.py（11 处）
    "python-multipart>=0.0.19",    # 隐式依赖：无直接 import，FastAPI 解析 UploadFile/File/Form
    #                                所需（src/api/task.py、review.py、loops.py），缺失即 500
    "httpx>=0.27",                 # httpx          ← src/api/auth.py:15

    # 数据库
    "SQLAlchemy[asyncio]>=2.0.36", # sqlalchemy     ← src/db/models.py 等（15 处）
    "aiosqlite>=0.20.0",           # 隐式依赖：无直接 import，SQLAlchemy 按 DATABASE_URL 的
    #                                "sqlite+aiosqlite://" 通过 entry point 加载异步驱动
    #                                （src/config/settings.py:20）

    # LLM / Agent
    "openai>=1.58.1",              # openai         ← src/services/llm.py:18、
    #                                src/agent_core/embeddings.py:137（try/except 软导入）
    "langgraph>=1.0",              # langgraph      ← src/agent_core/graph.py:21
    "langchain-core>=0.3",         # langchain_core ← src/agent_core/tools.py:482（函数内延迟导入）
    "chromadb>=1.5",               # chromadb       ← src/agent_core/_chroma.py:15、embeddings.py:26

    # 模板与安全
    "jinja2>=3.1.4",               # jinja2         ← src/prompts/loader.py:11
    "PyJWT>=2.8.0",                # jwt            ← src/api/auth.py:16
]

[project.optional-dependencies]
# 开发依赖 —— CLI 工具链（ruff/black/mypy/pytest-cov）不产生 import，按工具用途保留
dev = [
    "pytest>=8.0",          # pytest         ← tests/*.py（9 处）
    "pytest-asyncio>=0.23", # pytest_asyncio ← tests/test_loops.py:9
    "pytest-cov>=5.0",      # CLI 插件：覆盖率统计（--cov），无 import
    "ruff>=0.4.0",          # CLI 工具：lint，无 import
    "black>=24.0",          # CLI 工具：格式化，无 import
    "mypy>=1.0",            # CLI 工具：类型检查，无 import
]

[project.urls]
Homepage = "https://github.com/ai-marketing/strategy-agent"
Issues = "https://github.com/ai-marketing/strategy-agent/issues"
"Source Code" = "https://github.com/ai-marketing/strategy-agent"

# ==============================================================
# Black（formatter）— 2-space 缩进项目全局 4 space for Python
# ==============================================================
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
preview = true
skip-string-normalization = false

# ==============================================================
# Ruff（linter + isort 替代）— 规则集：F / E / W / I / N / UP / B / A
# ==============================================================
[tool.ruff]
line-length = 100
target-version = "py39"
preview = true
src = ["backend", "tests"]

[tool.ruff.lint]
select = [
    # flake8 built-ins
    "F",  # Pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8 naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff specific
]
ignore = [
    "E501",      # line-too-long → 交给 black 控制
    "B008",      # function-calls-in-default-arguments（Pydantic / FastAPI 常见模式）
    "A003",      # shadow-builtin（保留 class / id 等常见业务字段）
    "N806",      # non-lowercase-variable-in-function（兼容测试用例的 CAPS fixture）
]
# 文件级别排除
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    "*.egg-info",
    "data/app.db",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "PLR2004"]  # 测试允许 assert + 假随机数

[tool.ruff.lint.isort]
# 与 black 兼容的 isort 配置
known-first-party = ["backend", "tests", "agents", "api", "config", "db", "models", "services", "prompts", "skills", "utils"]
case-sensitive = true
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true
lines-after-imports = 2
# 自定义 sections（ruff 0.4.x mapping 语法）
[tool.ruff.lint.isort.sections]
FUTURE = ["__future__"]
STDLIB = []
THIRDPARTY = []
FIRSTPARTY = []
LOCALFOLDER = ["."]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

# ==============================================================
# MyPy（静态类型检查）— 宽松起步，后续可加 strict = true
# ==============================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
follow_imports = "silent"
exclude = [
    "tests/",
    "node_modules/",
]

# ==============================================================
# Pytest
# ==============================================================
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["backend", "tests", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short -q"
asyncio_mode = "auto"
markers = [
    "asyncio: marks tests as asynchronous",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests (require live services)",
    "snapshot: marks snapshot tests",
]
