# =========================================================================
# 项目级配置（GitHub 开源标准）
# Python: 3.9+  |  Linter: Ruff (替代 flake8+isort)  |  Formatter: Black
# =========================================================================
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-marketing-strategy-agent"
version = "0.3.0"
description = "AI企业营销战略执行智能体 — FastAPI 后端 + 微信小程序前端"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "AI Marketing Team" }
]
keywords = [
    "marketing",
    "agent",
    "fastapi",
    "wechat-miniprogram",
    "ai",
    "gpt",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "snapshottest>=0.6",
    "ruff>=0.4.0",
    "black>=24.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/ai-marketing/strategy-agent"
Issues = "https://github.com/ai-marketing/strategy-agent/issues"
"Source Code" = "https://github.com/ai-marketing/strategy-agent"

# ==============================================================
# Black（formatter）— 2-space 缩进项目全局 4 space for Python
# ==============================================================
[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]
preview = true
skip-string-normalization = false

# ==============================================================
# Ruff（linter + isort 替代）— 规则集：F / E / W / I / N / UP / B / A
# ==============================================================
[tool.ruff]
line-length = 100
target-version = "py39"
preview = true
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    # flake8 built-ins
    "F",  # Pyflakes
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "I",  # isort
    "N",  # pep8 naming
    "UP",  # pyupgrade
    "B",  # flake8-bugbear
    "A",  # flake8-builtins
    "C4",  # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff specific
]
ignore = [
    "E501",      # line-too-long → 交给 black 控制
    "B008",      # function-calls-in-default-arguments（Pydantic / FastAPI 常见模式）
    "A003",      # shadow-builtin（保留 class / id 等常见业务字段）
    "N806",      # non-lowercase-variable-in-function（兼容测试用例的 CAPS fixture）
]
# 文件级别排除
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
    "dist",
    "build",
    "*.egg-info",
    "data/app.db",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "PLR2004"]  # 测试允许 assert + 假随机数

[tool.ruff.lint.isort]
# 与 black 兼容的 isort 配置
known-first-party = ["src", "tests", "agents", "api", "config", "db", "models", "services", "prompts", "skills", "utils"]
case-sensitive = true
force-single-line = false
force-wrap-aliases = true
combine-as-imports = true
lines-after-imports = 2
# 自定义 sections（ruff 0.4.x mapping 语法）
[tool.ruff.lint.isort.sections]
FUTURE = ["__future__"]
STDLIB = []
THIRDPARTY = []
FIRSTPARTY = []
LOCALFOLDER = ["."]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

# ==============================================================
# MyPy（静态类型检查）— 宽松起步，后续可加 strict = true
# ==============================================================
[tool.mypy]
python_version = "3.9"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
follow_imports = "silent"
exclude = [
    "tests/",
    "node_modules/",
]

# ==============================================================
# Pytest
# ==============================================================
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["src", "tests", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short -q"
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests (require live services)",
    "snapshot: marks snapshot tests",
]
